name: Ranking mensual de billeteras

on:
  schedule:
    # 14:00 UTC = 09:00 hora Perú. Se dispara los días 28 al 31 de cada mes y el
    # paso "Verificar" deja continuar solo el último día real del mes.
    - cron: "0 14 28-31 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Mes a extraer en formato YYYY-MM. Vacío = mes actual."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ranking-mensual
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verificar si hoy es el último día del mes
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(TZ=America/Lima date -d 'tomorrow' +%d)" = "01" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Hoy es el último día del mes en Lima: se ejecuta la extracción."
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Hoy no es el último día del mes: no se hace nada."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución manual: se ejecuta la extracción."
          fi

      - name: Checkout repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Ejecutar extracción
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            python extract_ranking.py --month "${{ github.event.inputs.month }}"
          else
            python extract_ranking.py
          fi

      - name: Commit y push de los datos del mes
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_*.csv iconos_*.json calidad_servicio_*.csv
          git diff --cached --quiet || git commit -m "Datos ranking billeteras $(TZ=America/Lima date +'%Y-%m-%d')"
          git pull --rebase
          git push
